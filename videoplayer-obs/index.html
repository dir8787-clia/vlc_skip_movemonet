<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Видеоплеер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="video-container">
        <video id="video-player" controls></video>
    </div>
    
    <div id="controls">
        <h1>OBS Видеоплеер</h1>
        
        <div class="playlist-controls">
            <h3>Загрузка плейлиста</h3>
            <div class="input-group">
                <label for="playlist-file">Выбрать локальный файл:</label>
                <input type="file" id="playlist-file" accept=".m3u,.m3u8">
            </div>
            
            <div class="input-group">
                <label for="playlist-url">Загрузить по ссылке:</label>
                <input type="text" id="playlist-url" placeholder="http://192.168.0.29:8090/12.m3u">
                <button id="load-url-btn">Загрузить по ссылке</button>
            </div>
        </div>
        
        <div class="player-controls">
            <button id="prev-btn">Предыдущее</button>
            <button id="play-pause-btn">Пауза</button>
            <button id="next-btn">Следующее</button>
            <span id="current-video-info"></span>
        </div>
        
        <div class="skip-controls">
            <button id="toggle-skip-editor">Редактировать пропуски</button>
            <div id="skip-editor" class="skip-editor-panel">
                <h3>Редактор пропусков</h3>
                <div id="skip-list"></div>
                <button id="add-skip-btn">Добавить пропуск с текущей позиции</button>
                <button id="download-skip-rules">Сохранить как JSON-файл</button>
                <button id="close-skip-editor">Закрыть</button>
            </div>
        </div>
        
        <div class="interface-controls">
            <button id="toggle-controls">Скрыть управление</button>
        </div>
    </div>
    
    <script src="player.js"></script>
</body>
</html>
